name: TestJava
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download JUnit
        run: |
          mkdir lib
          curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Compile
        run: |
          mkdir out
          javac -cp "lib/*" -d out src/chatapppoe/*.java test/chatapppoe/*.java
      - name: Run tests
        run: java -cp "out:lib/*" org.junit.runner.JUnitCore chatapppoe.MessageTest
